<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Shared host-memory weight cache</title>
  <desc id="desc">Several checkpoints are loaded once into a shared RAM-backed tmpfs file. Each serving process on the node maps and registers its own view of the same host pages, then copies the weights of the checkpoint it needs into its own GPU. Two processes are shown holding different active checkpoints.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <marker id="arrowblue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowgreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, Arial, sans-serif; fill: #475569; }
      .section { font: 700 23px Inter, Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 19px Inter, Arial, sans-serif; fill: #1e293b; }
      .small { font: 400 16px Inter, Arial, sans-serif; fill: #475569; }
      .tiny { font: 600 15px Inter, Arial, sans-serif; fill: #475569; }
      .mono { font: 500 16px "SF Mono", Consolas, monospace; fill: #1e293b; }
      .node { fill: #f8fafc; stroke: #334155; stroke-width: 3; }
      .storage { fill: #fff7ed; stroke: #f97316; stroke-width: 3; }
      .cache { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .worker { fill: #ffffff; stroke: #64748b; stroke-width: 2.5; }
      .cpu { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .gpu { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .shared-arrow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowblue); }
      .dma-arrow { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#arrowgreen); }
    </style>
  </defs>

  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="70" y="68" class="title">Shared host-memory weight cache</text>
  <text x="70" y="104" class="subtitle">One physical host copy per checkpoint, independently mapped and registered by each serving process</text>

  <rect x="40" y="132" width="1520" height="690" rx="28" class="node"/>
  <text x="72" y="176" class="section">GPU node</text>

  <!-- Checkpoint storage -->
  <g filter="url(#shadow)">
    <rect x="75" y="300" width="250" height="250" rx="22" class="storage"/>
  </g>
  <text x="200" y="345" text-anchor="middle" class="section">Checkpoint store</text>
  <text x="200" y="373" text-anchor="middle" class="small">disk</text>
  <rect x="115" y="395" width="170" height="32" rx="7" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <rect x="115" y="437" width="170" height="32" rx="7" fill="#fdba74" stroke="#f97316" stroke-width="2"/>
  <rect x="115" y="479" width="170" height="32" rx="7" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <text x="200" y="537" text-anchor="middle" class="small">serialized weights</text>

  <path d="M325 425 H400" class="arrow"/>
  <text x="362" y="408" text-anchor="middle" class="tiny">load once</text>

  <!-- Shared cache -->
  <g filter="url(#shadow)">
    <rect x="405" y="228" width="420" height="400" rx="24" class="cache"/>
  </g>
  <text x="615" y="275" text-anchor="middle" class="section">Shared host cache</text>
  <text x="615" y="303" text-anchor="middle" class="small">RAM-backed tmpfs file, page-locked</text>

  <rect x="455" y="330" width="320" height="52" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="478" y="362" class="mono">checkpoint A</text>
  <circle cx="742" cy="356" r="7" fill="#059669"/>
  <rect x="455" y="396" width="320" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="478" y="428" class="mono">checkpoint B</text>
  <circle cx="742" cy="422" r="7" fill="#cbd5e1"/>
  <rect x="455" y="462" width="320" height="52" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="478" y="494" class="mono">checkpoint C</text>
  <circle cx="742" cy="488" r="7" fill="#059669"/>

  <circle cx="470" cy="552" r="7" fill="#059669"/>
  <text x="486" y="558" class="tiny">active on a GPU</text>
  <circle cx="470" cy="582" r="7" fill="#cbd5e1"/>
  <text x="486" y="588" class="tiny">cached, idle</text>
  <text x="615" y="612" text-anchor="middle" class="small">one physical copy, however many processes map it</text>

  <!-- Worker A -->
  <g filter="url(#shadow)">
    <rect x="1000" y="200" width="500" height="250" rx="24" class="worker"/>
  </g>
  <text x="1032" y="240" class="label">Serving process A</text>
  <rect x="1030" y="265" width="200" height="150" rx="18" class="cpu"/>
  <text x="1130" y="304" text-anchor="middle" class="label">host view</text>
  <text x="1130" y="336" text-anchor="middle" class="small">shared mmap</text>
  <text x="1130" y="364" text-anchor="middle" class="small">cudaHostRegister</text>
  <text x="1130" y="392" text-anchor="middle" class="tiny">own virtual range</text>
  <rect x="1300" y="265" width="170" height="150" rx="18" class="gpu"/>
  <text x="1385" y="304" text-anchor="middle" class="label">GPU 0</text>
  <text x="1385" y="340" text-anchor="middle" class="mono">checkpoint A</text>
  <text x="1385" y="370" text-anchor="middle" class="small">active in HBM</text>
  <path d="M1230 340 H1292" class="dma-arrow"/>
  <text x="1261" y="323" text-anchor="middle" class="tiny">DMA</text>

  <!-- Worker B -->
  <g filter="url(#shadow)">
    <rect x="1000" y="515" width="500" height="250" rx="24" class="worker"/>
  </g>
  <text x="1032" y="555" class="label">Serving process B</text>
  <rect x="1030" y="580" width="200" height="150" rx="18" class="cpu"/>
  <text x="1130" y="619" text-anchor="middle" class="label">host view</text>
  <text x="1130" y="651" text-anchor="middle" class="small">shared mmap</text>
  <text x="1130" y="679" text-anchor="middle" class="small">cudaHostRegister</text>
  <text x="1130" y="707" text-anchor="middle" class="tiny">own virtual range</text>
  <rect x="1300" y="580" width="170" height="150" rx="18" class="gpu"/>
  <text x="1385" y="619" text-anchor="middle" class="label">GPU 1</text>
  <text x="1385" y="655" text-anchor="middle" class="mono">checkpoint C</text>
  <text x="1385" y="685" text-anchor="middle" class="small">active in HBM</text>
  <path d="M1230 655 H1292" class="dma-arrow"/>
  <text x="1261" y="638" text-anchor="middle" class="tiny">DMA</text>

  <!-- Shared mappings -->
  <path d="M825 356 C890 356 920 325 995 325" class="shared-arrow"/>
  <text x="910" y="306" text-anchor="middle" class="tiny">shared mapping</text>
  <path d="M825 488 C890 488 920 640 995 640" class="shared-arrow"/>
  <text x="893" y="545" text-anchor="middle" class="tiny">shared mapping</text>

  <!-- Switch-phase band: mirrors T_switch = T_copy + T_attach + T_release -->
  <rect x="75" y="648" width="810" height="142" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="97" y="682" class="label">One switch, three phases</text>

  <rect x="97" y="698" width="228" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="211" y="728" text-anchor="middle" class="mono">release to meta</text>
  <text x="211" y="768" text-anchor="middle" class="tiny">constant</text>

  <path d="M333 722 H349" class="arrow"/>

  <rect x="357" y="698" width="228" height="48" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="471" y="728" text-anchor="middle" class="mono">copy  =  S / B</text>
  <text x="471" y="768" text-anchor="middle" class="tiny">scales with weight-set size</text>

  <path d="M593 722 H609" class="arrow"/>

  <rect x="617" y="698" width="228" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="731" y="728" text-anchor="middle" class="mono">attach  assign=True</text>
  <text x="731" y="768" text-anchor="middle" class="tiny">constant</text>
</svg>
