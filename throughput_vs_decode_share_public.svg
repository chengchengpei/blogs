<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Total throughput versus decode share</title>
  <desc id="desc">Measured serving throughput decreases as decode share increases. Points with KV-cache preemptions are highlighted in orange.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .grid { stroke: #dfe3e8; stroke-width: 1; }
    .axis { stroke: #59636e; stroke-width: 1.5; }
    .tick { font-size: 13px; fill: #59636e; }
    .label { font-size: 15px; font-weight: 600; }
    .fit { stroke: #3977b7; stroke-width: 3; stroke-dasharray: 9 7; }
    .healthy { fill: #1976b9; stroke: white; stroke-width: 2; }
    .preempted { fill: #e87524; stroke: white; stroke-width: 2; }
    .legend { font-size: 13px; }
  </style>

  <rect width="900" height="520" fill="white"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="650">Total throughput falls as decode share rises</text>

  <!-- horizontal grid: 10K, 15K, 20K, 25K, 30K -->
  <g>
    <line class="grid" x1="90" y1="445" x2="850" y2="445"/>
    <line class="grid" x1="90" y1="356.4" x2="850" y2="356.4"/>
    <line class="grid" x1="90" y1="267.7" x2="850" y2="267.7"/>
    <line class="grid" x1="90" y1="179.1" x2="850" y2="179.1"/>
    <line class="grid" x1="90" y1="90.5" x2="850" y2="90.5"/>
  </g>

  <!-- vertical grid: 0%, 25%, 50%, 75%, 100% -->
  <g>
    <line class="grid" x1="90" y1="55" x2="90" y2="445"/>
    <line class="grid" x1="280" y1="55" x2="280" y2="445"/>
    <line class="grid" x1="470" y1="55" x2="470" y2="445"/>
    <line class="grid" x1="660" y1="55" x2="660" y2="445"/>
    <line class="grid" x1="850" y1="55" x2="850" y2="445"/>
  </g>

  <line class="axis" x1="90" y1="445" x2="850" y2="445"/>
  <line class="axis" x1="90" y1="55" x2="90" y2="445"/>

  <g class="tick" text-anchor="end">
    <text x="80" y="450">10K</text>
    <text x="80" y="361">15K</text>
    <text x="80" y="272">20K</text>
    <text x="80" y="184">25K</text>
    <text x="80" y="95">30K</text>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="90" y="468">0%</text>
    <text x="280" y="468">25%</text>
    <text x="470" y="468">50%</text>
    <text x="660" y="468">75%</text>
    <text x="850" y="468">100%</text>
  </g>
  <text class="label" x="470" y="502" text-anchor="middle">Decode share</text>
  <text class="label" transform="translate(24 250) rotate(-90)" text-anchor="middle">Total throughput (tokens/s)</text>

  <!-- T(s) = (1-s) * 29.5K + s * 14.3K -->
  <line class="fit" x1="90" y1="99.7" x2="850" y2="369.0"/>

  <!-- Public fixed-shape measurements. Hover for input/output shape. -->
  <g>
    <circle class="healthy" cx="90.0" cy="131.7" r="7"><title>32,000 input / 1 output: 27,673 tok/s</title></circle>
    <circle class="healthy" cx="90.1" cy="116.1" r="7"><title>10,000 input / 1 output: 28,555 tok/s</title></circle>
    <circle class="healthy" cx="90.8" cy="77.8" r="7"><title>1,000 input / 1 output: 30,716 tok/s</title></circle>
    <circle class="healthy" cx="97.5" cy="80.6" r="7"><title>100 input / 1 output: 30,556 tok/s</title></circle>
    <circle class="healthy" cx="97.5" cy="130.3" r="7"><title>10,000 input / 100 output: 27,752 tok/s</title></circle>
    <circle class="healthy" cx="159.1" cy="106.4" r="7"><title>1,000 input / 100 output: 29,103 tok/s</title></circle>
    <circle class="healthy" cx="470.0" cy="222.2" r="7"><title>100 input / 100 output: 22,568 tok/s</title></circle>
    <circle class="preempted" cx="660.0" cy="258.2" r="7"><title>1,000 input / 3,000 output: 20,538 tok/s, 21 preemptions</title></circle>
    <circle class="preempted" cx="780.9" cy="356.9" r="7"><title>100 input / 1,000 output: 14,972 tok/s, 76 preemptions</title></circle>
    <circle class="healthy" cx="842.5" cy="344.2" r="7"><title>100 input / 10,000 output: 15,684 tok/s</title></circle>
    <circle class="preempted" cx="847.6" cy="419.2" r="7"><title>100 input / 32,000 output: 11,458 tok/s, 15 preemptions</title></circle>
  </g>

  <g transform="translate(595 68)">
    <rect x="0" y="0" width="240" height="72" rx="7" fill="white" stroke="#d5dbe1"/>
    <line class="fit" x1="14" y1="18" x2="48" y2="18"/>
    <text class="legend" x="58" y="23">linear estimate</text>
    <circle class="healthy" cx="30" cy="40" r="6"/>
    <text class="legend" x="58" y="45">no preemptions</text>
    <circle class="preempted" cx="30" cy="61" r="6"/>
    <text class="legend" x="58" y="66">KV preemptions</text>
  </g>
</svg>
